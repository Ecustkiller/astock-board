name = "astock-board"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# Pages Functions 使用的 KV 命名空间。
# 部署前请先创建：wrangler kv namespace create astock_cache
# 然后把输出的 id 填到下面（替换 REPLACE_WITH_YOUR_KV_NAMESPACE_ID）。
[[kv_namespaces]]
binding = "KPL_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
